# fluxopt core math as an lpspec program.
#
# Semantics mirror fluxopt.model.FlowSystemModel:
#   - end-of-period storage convention, level[t] = level[t-1]*retention + net
#   - cyclic storage wraps (shift edge='wrap'), acyclic uses a data-side prior
#   - effect coefficients arrive Leontief-folded and dt/weight-scaled
#
# Every relation is a lookup out of `flow`, read by sum(by=) — topology is
# rows in an index table, never an adjacency matrix. Sparsity is carried by
# row absence: a parameter keeps its declared rank, its table only holds live
# entries.
#
# One rule shapes how this file reads: a constraint is one row-rule, so an
# alternative guarded by a different `where` is its own named constraint
# rather than a branch inside one. The masks of a family are disjoint and
# together cover the family's rows.

dimensions:
  time: {dtype: int}
  period: {dtype: int}
  # The period a unit was built in. Same labels as `period`; a separate axis
  # so a build decision can be summed into the periods it keeps alive.
  build_period: {dtype: int}
  carrier: {dtype: str}
  converter: {dtype: str}
  eq_idx: {dtype: int}
  storage: {dtype: str}
  effect: {dtype: str}
  flow: {dtype: str}
  # Whatever carries an on/off decision: a flow with its own Status, or a
  # component whose Status governs several flows at once. One dimension,
  # because the two differ only in which rows read the binary.
  status_entity: {dtype: str}
  # Breakpoint index of a piecewise curve. The dimension is the widest
  # curve in the system; narrower ones mask their tail away.
  bp: {dtype: int}

# Every relation a flow participates in, as a map out of the flow label. These
# arrive as columns on the `flow` index table, each named for its lookup.
# `_of` where the bare name would shadow the dimension it maps into — the
# namespace is flat and refuses that.
lookups:
  carrier_of: {over: flow, into: carrier}
  converter_of: {over: flow, into: converter}
  charge_storage: {over: flow, into: storage}
  discharge_storage: {over: flow, into: storage}
  # The decision a flow's rate answers to: itself where the flow carries
  # its own Status, its component where a component's Status governs it,
  # null where nothing gates it. `at()` reads the binary back through it.
  status_of: {over: flow, into: status_entity}
  # A piecewise curve's own on/off decision, where its component has one.
  pw_status_of: {over: converter, into: status_entity}

parameters:
  # Boundary mask as data, not a `time > 0` comparison: with ragged
  # multi-period time the first step of *each* period is a boundary.
  is_first: {dims: [time], dtype: bool}

  # --- flows: absolute bounds (rel_bound * size, folded data-side because
  # bounds: accepts only a bare parameter name) ---------------------------
  rate_min: {dims: [flow, time, period]}
  rate_max: {dims: [flow, time, period]}
  # The largest rate a flow could ever carry: its fixed size, or the maximum
  # it could be sized to. A big-M wherever a binary has to release a rate —
  # a ramp across a start-up, a storage's charge/discharge exclusion. The
  # storage side reads it through the lookup rather than keeping a copy.
  size_bound: {dims: [flow]}

  # --- carrier balance ---------------------------------------------------
  carrier_sign: {dims: [flow]}

  # --- converters --------------------------------------------------------
  # A flow belongs to exactly one component, so the (converter, flow) matrix
  # collapses to a lookup plus a coefficient keyed on flow.
  conversion_factor: {dims: [flow, eq_idx, time]}
  conversion_active: {dims: [converter, eq_idx], dtype: bool}

  # --- storage -----------------------------------------------------------
  charge_gain: {dims: [storage, time]}     # eta_c * dt
  discharge_draw: {dims: [storage, time]}  # dt / eta_d
  retention: {dims: [storage, time]}       # (1 - loss) ** dt
  level_min: {dims: [storage, time]}
  level_max: {dims: [storage, time]}
  is_cyclic: {dims: [storage], dtype: bool}
  # Carries a period axis so a rolling-horizon fold can collapse `time`
  # alone: a carry reduces exactly one dimension, and the level it copies
  # forward is per period.
  prior_level: {dims: [storage, period]}

  # --- status (on/off) ----------------------------------------------------
  # `is_gated` is a flow-side mask: this rate answers to a binary. Which
  # binary is `status_of`. Every other parameter here is the decision's own,
  # so it sits on `status_entity` and is stated once for both kinds.
  is_gated: {dims: [flow], dtype: bool}
  is_bounded: {dims: [flow], dtype: bool}
  is_profile: {dims: [flow], dtype: bool}
  rate_min_when_on: {dims: [flow, time, period]}     # size * rel_lb, gated by `running`
  rate_max_when_on: {dims: [flow, time, period]}     # size * rel_ub, gated by `running`
  rate_fixed_when_on: {dims: [flow, time, period]}    # size * profile, gated by `running`
  has_uptime: {dims: [status_entity], dtype: bool}
  uptime_min: {dims: [status_entity]}
  # The duration variable's ceiling: the declared maximum, or the big-M where
  # none is declared. A property of the entity, so lpspec broadcasts it over
  # the (time, period) grid the variable itself is declared on.
  uptime_upper: {dims: [status_entity]}
  uptime_big_m: {dims: [status_entity]}     # big-M: horizon + any prior uptime
  downtime_big_m: {dims: [status_entity]}   # big-M: horizon + any prior downtime
  dt: {dims: [time]}                       # timestep duration [h]
  is_last: {dims: [time], dtype: bool}
  has_downtime: {dims: [status_entity], dtype: bool}
  downtime_min: {dims: [status_entity]}
  downtime_upper: {dims: [status_entity]}
  initial_status: {dims: [status_entity]}
  previous_uptime: {dims: [status_entity]}
  previous_downtime: {dims: [status_entity]}
  forced_on_at_start: {dims: [status_entity], dtype: bool}   # prior run shorter than uptime_min
  forced_off_at_start: {dims: [status_entity], dtype: bool}
  effects_per_running_hour: {dims: [status_entity, effect, time, period]}   # running effects * dt
  effects_per_startup: {dims: [status_entity, effect, time, period]}        # startup effects

  # --- sizing (capacity optimisation) -------------------------------------
  has_sizing: {dims: [flow], dtype: bool}
  # Whether the build decision is already taken. Serves both mechanisms: a
  # flow's size is a `Sizing` or an `Investment`, never both, so the two
  # never claim the same row.
  mandatory: {dims: [flow], dtype: bool}
  size_min: {dims: [flow]}
  size_max: {dims: [flow]}
  size_upper: {dims: [flow, period]}   # upper bound of `size`: sizing max or invest max
  relative_rate_min: {dims: [flow, time, period]}
  relative_rate_max: {dims: [flow, time, period]}
  fixed_relative_profile: {dims: [flow, time, period]}
  # Lump-domain effect coefficients, Leontief-folded like the temporal ones.
  effects_per_size: {dims: [flow, effect, period]}
  effects_fixed: {dims: [flow, effect, period]}

  # --- status x sizing: big-M decoupling of the binary from the size -------
  rate_max_at_size_max: {dims: [flow, time, period]}   # size_max * rel_ub
  rate_min_at_size_max: {dims: [flow, time, period]}   # size_max * rel_lb

  # --- investment (build timing over periods) ------------------------------
  has_invest: {dims: [flow], dtype: bool}
  invest_min: {dims: [flow]}
  invest_max: {dims: [flow]}
  prior_capacity: {dims: [flow]}
  has_prior_capacity: {dims: [flow], dtype: bool}
  # 1 where a build in `build_period` is still within lifetime in `period`
  lifetime_window: {dims: [flow, period, build_period]}
  # 1 where pre-existing capacity is still active
  prior_capacity_active: {dims: [flow, period]}
  # lump coefficients, Leontief-folded like the rest
  # At-build effects land in the period the unit was built in, not in every
  # period, so these carry both axes and are non-zero only on the diagonal.
  effects_per_size_at_build: {dims: [flow, effect, period, build_period]}
  effects_fixed_at_build: {dims: [flow, effect, period, build_period]}
  effects_per_size_recurring: {dims: [flow, effect, period]}
  effects_fixed_recurring: {dims: [flow, effect, period]}

  # --- ramps --------------------------------------------------------------
  has_ramp_up: {dims: [flow], dtype: bool}
  has_ramp_down: {dims: [flow], dtype: bool}
  ramp_up_limit: {dims: [flow, time, period]}    # r+ * dt * size   (fixed size)
  ramp_down_limit: {dims: [flow, time, period]}
  ramp_up_coeff: {dims: [flow, time, period]}    # r+ * dt          (sized: size is a variable)
  ramp_down_coeff: {dims: [flow, time, period]}

  # --- storage: end-of-horizon bounds and charge/discharge exclusion --------
  final_level_min: {dims: [storage]}
  final_level_max: {dims: [storage]}
  prevent_simultaneous: {dims: [storage], dtype: bool}

  # --- storage sizing -----------------------------------------------------
  has_capacity_sizing: {dims: [storage], dtype: bool}
  capacity_mandatory: {dims: [storage], dtype: bool}
  capacity_min: {dims: [storage]}
  capacity_max: {dims: [storage]}
  relative_level_min: {dims: [storage, time]}
  relative_level_max: {dims: [storage, time]}
  effects_per_capacity: {dims: [storage, effect, period]}
  effects_fixed_capacity: {dims: [storage, effect, period]}

  # --- flow aggregates: the horizon's total, bounded per period ------------
  # `flow_hour_weight` is dt * time_weight, so the sum is energy rather than
  # a count of steps. Load factors are the same bound stated relative to size,
  # which is why a sized flow needs the coefficient rather than the product.
  flow_hour_weight: {dims: [time]}
  flow_hours_min: {dims: [flow, period]}
  flow_hours_max: {dims: [flow, period]}
  load_factor_min_bound: {dims: [flow, period]}    # lambda * size * T, fixed size
  load_factor_max_bound: {dims: [flow, period]}
  load_factor_min_coeff: {dims: [flow, period]}    # lambda * T, size a variable
  load_factor_max_coeff: {dims: [flow, period]}

  # --- piecewise conversion ------------------------------------------------
  # The lambda formulation, written out rather than declared: lpspec's
  # `piecewise:` block takes a static list of links, and fluxopt's curves vary
  # in how many flows they tie together. Here a link is a *row* — one per curve
  # flow, keyed on `flow` — so arity is data like everything else.
  has_piecewise: {dims: [converter], dtype: bool}
  pw_gated: {dims: [converter], dtype: bool}       # the curve answers to a Status
  pw_bp_present: {dims: [converter, bp], dtype: bool}   # this curve has this breakpoint
  pw_seg_present: {dims: [converter, bp], dtype: bool}  # ...and a segment starts here
  is_piecewise: {dims: [flow], dtype: bool}        # this flow is a link of a curve
  pw_equal: {dims: [flow], dtype: bool}            # pinned to the curve
  pw_upper: {dims: [flow], dtype: bool}            # bounded above by it
  pw_lower: {dims: [flow], dtype: bool}            # bounded below by it
  pw_bp_value: {dims: [flow, bp, time]}            # this link's breakpoint values
  pw_ref: {dims: [flow]}                           # 1 on the link availability scales
  pw_avail_bound: {dims: [converter, time, period]}  # availability * widest breakpoint

  # --- effects -----------------------------------------------------------
  # coeff * dt * time_weight, Leontief inverse already folded in (numpy).
  # Declared (flow, effect, time); only live pairs are supplied.
  effects_per_flow_hour: {dims: [flow, effect, time, period]}
  # objective weight x period weight, folded data-side
  objective_weight: {dims: [effect, period]}
  # effect limits: per period, and across periods (weighted)
  periodic_min: {dims: [effect, period]}
  periodic_max: {dims: [effect, period]}
  total_min: {dims: [effect]}
  total_max: {dims: [effect]}
  period_weight: {dims: [effect, period]}
  # Aggregation weight per timestep; multiplies where the sum happens.
  time_weight: {dims: [time]}

variables:
  rate:
    foreach: [flow, time, period]
    bounds: {lower: rate_min, upper: rate_max}

  level:
    foreach: [storage, time, period]
    bounds: {lower: level_min, upper: level_max}

  # No `where:` — membership of `status_entity` is the mask. An entity is in
  # the dimension because it carries a Status; there is no second way to say so.
  running:
    foreach: [status_entity, time, period]
    domain: binary

  startup:
    foreach: [status_entity, time, period]
    domain: binary

  shutdown:
    foreach: [status_entity, time, period]
    domain: binary

  uptime:
    foreach: [status_entity, time, period]
    where: "has_uptime"
    bounds: {lower: 0, upper: uptime_upper}

  downtime:
    foreach: [status_entity, time, period]
    where: "has_downtime"
    bounds: {lower: 0, upper: downtime_upper}

  # Investment flows share this variable — `size` is the capacity available in
  # a period, whether it came from Sizing or from a build decision.
  size:
    foreach: [flow, period]
    where: "has_sizing OR has_invest"
    bounds: {lower: 0, upper: size_upper}

  invest_size:
    foreach: [flow]
    where: "has_invest"
    bounds: {lower: 0, upper: invest_max}

  invest_build:
    foreach: [flow, build_period]
    where: "has_invest"
    domain: binary

  invest_active:
    foreach: [flow, period]
    where: "has_invest"
    domain: binary

  invest_size_at_build:
    foreach: [flow, build_period]
    where: "has_invest"
    bounds: {lower: 0, upper: invest_max}

  # Every sized flow has one, not only the optional ones: a mandatory build
  # is the same decision already taken, and pinning it to 1 is cheaper than a
  # constant term — a constant cannot be attributed to the flow that owes it,
  # and on the constant side of the ledger it has to be covered for every row.
  size_built:
    foreach: [flow, period]
    where: "has_sizing"
    domain: binary

  capacity:
    foreach: [storage, period]
    where: "has_capacity_sizing"
    bounds: {lower: 0, upper: capacity_max}

  capacity_built:
    foreach: [storage, period]
    where: "has_capacity_sizing"
    domain: binary

  charging:
    foreach: [storage, time, period]
    where: "prevent_simultaneous"
    domain: binary

  # Convex-combination weights over the breakpoints of each curve.
  lam:
    foreach: [converter, bp, time, period]
    where: "pw_bp_present"
    bounds: {lower: 0, upper: 1}

  # Which segment the operating point sits on. `absence: zero` is what makes
  # the adjacency row read correctly at the last breakpoint, where no segment
  # starts: the term goes to zero rather than taking the row with it.
  seg:
    foreach: [converter, bp, time, period]
    where: "pw_seg_present"
    absence: zero
    domain: binary

  effect_total:
    foreach: [effect, period]
    bounds: {lower: -.inf, upper: .inf}

expressions:
  # The two halves of the ledger, named rather than inlined: each is a
  # quantity the model reports, and naming them is what makes them readable
  # after a solve through `result.expression(...)` — computed by the compiler
  # that built the accounting row, so the split cannot drift from the total.
  # --- attribution -------------------------------------------------------
  # Every contribution is named *before* it is summed, and keeps the entity it
  # came from. The accounting row below sums these very expressions, so what a
  # reader gets back from `result.expression(...)` is not a reconstruction of
  # the model's arithmetic — it is the model's arithmetic, one step earlier.
  #
  # `time_weight` multiplies in the sum rather than in the coefficient, so a
  # contribution reads as the physical per-step quantity and the aggregation
  # weight stays where aggregation happens.
  contribution_flow_hour:
    expression: rate * effects_per_flow_hour
    description: What each flow's throughput contributes, per timestep.
  contribution_running:
    expression: running * effects_per_running_hour
    description: What being on costs, per timestep, for whatever carries the decision.
  contribution_startup:
    expression: startup * effects_per_startup
    description: What each start costs, at the step it happens.

  contribution_flow_per_size:
    expression: size * effects_per_size
    description: What a flow's built size costs, per period.
  contribution_flow_fixed:
    expression: size_built * effects_fixed
    description: What deciding to build a flow costs at all, per period.
  contribution_storage_per_capacity:
    expression: capacity * effects_per_capacity
    description: What a storage's built capacity costs, per period.
  contribution_storage_fixed:
    expression: capacity_built * effects_fixed_capacity
    description: What deciding to build a storage costs at all, per period.

  contribution_invest_per_size_at_build:
    expression: invest_size_at_build * effects_per_size_at_build
    description: What the built size costs, charged to the period it was built in.
  contribution_invest_fixed_at_build:
    expression: invest_build * effects_fixed_at_build
    description: What the build decision costs, charged where it happened.
  contribution_invest_per_size_recurring:
    expression: size * effects_per_size_recurring
    description: What keeping the size costs, every period it is alive.
  contribution_invest_fixed_recurring:
    expression: invest_active * effects_fixed_recurring
    description: What keeping the unit costs, every period it is alive.

  effect_temporal:
    expression: >-
      sum(sum(contribution_flow_hour * time_weight, over=time), over=flow)
      + sum(sum(contribution_running * time_weight, over=time), over=status_entity)
      + sum(sum(contribution_startup * time_weight, over=time), over=status_entity)
    description: What running the system costs, accumulated over the horizon.

  effect_lump:
    expression: >-
      sum(contribution_flow_per_size, over=flow)
      + sum(contribution_flow_fixed, over=flow)
      + sum(contribution_storage_per_capacity, over=storage)
      + sum(contribution_storage_fixed, over=storage)
      + sum(sum(contribution_invest_per_size_at_build, over=build_period), over=flow)
      + sum(sum(contribution_invest_fixed_at_build, over=build_period), over=flow)
      + sum(contribution_invest_per_size_recurring, over=flow)
      + sum(contribution_invest_fixed_recurring, over=flow)
    description: What building it costs — one-time and recurring, never per step.

  net_charge:
    expression: >-
      sum(rate, by=charge_storage) * charge_gain
      - sum(rate, by=discharge_storage) * discharge_draw
    description: Energy entering a storage per step, net of discharge draw.

constraints:
  carrier_balance:
    foreach: [carrier, time, period]
    expression: sum(rate * carrier_sign, by=carrier_of) == 0

  conversion:
    foreach: [converter, eq_idx, time, period]
    where: "conversion_active"
    expression: sum(rate * conversion_factor, by=converter_of) == 0

  # --- storage recurrence: the three cases are disjoint and cover every row.
  # cyclic wraps, so t=0 reads level[last] and needs no prior variable.
  storage_balance_cyclic:
    foreach: [storage, time, period]
    where: "is_cyclic"
    expression: level == shift(level, over=time, offset=1, edge='wrap') * retention + net_charge

  storage_balance_step:
    foreach: [storage, time, period]
    where: "NOT is_cyclic AND NOT is_first"
    expression: level == shift(level, over=time, offset=1) * retention + net_charge

  storage_balance_prior:
    foreach: [storage, time, period]
    where: "NOT is_cyclic AND is_first"
    expression: level == prior_level * retention + net_charge

  # --- semi-continuous rate: {0} u [size*rel_lb, size*rel_ub], via `running`.
  # `at(running, by=status_of)` is what makes one family serve both kinds of
  # Status: a flow that carries its own reads its own binary, a flow governed
  # by a component reads that component's, and neither knows the difference.
  status_rate_min:
    foreach: [flow, time, period]
    where: "is_gated AND NOT has_sizing AND is_bounded"
    expression: rate >= rate_min_when_on * at(running, by=status_of)

  status_rate_max:
    foreach: [flow, time, period]
    where: "is_gated AND NOT has_sizing AND is_bounded"
    expression: rate <= rate_max_when_on * at(running, by=status_of)

  status_rate_fixed:
    foreach: [flow, time, period]
    where: "is_gated AND NOT has_sizing AND is_profile"
    expression: rate == rate_fixed_when_on * at(running, by=status_of)

  status_transition:
    foreach: [status_entity, time, period]
    where: "NOT is_first"
    expression: startup - shutdown == running - shift(running, over=time, offset=1)

  status_transition_initial:
    foreach: [status_entity, time, period]
    where: "initial_status AND is_first"
    expression: startup - shutdown == running - initial_status

  status_exclusive:
    foreach: [status_entity, time, period]
    expression: startup + shutdown <= 1

  # --- big-M duration tracking: uptime[t] accumulates dt while `running`.
  uptime_gate:
    foreach: [status_entity, time, period]
    where: "has_uptime"
    expression: uptime <= uptime_big_m * running

  uptime_accum_max:
    foreach: [status_entity, time, period]
    where: "has_uptime AND NOT is_first"
    expression: uptime <= shift(uptime, over=time, offset=1) + shift(dt, over=time, offset=1, edge=0)

  uptime_accum_min:
    foreach: [status_entity, time, period]
    where: "has_uptime AND NOT is_first"
    expression: >-
      uptime >= shift(uptime, over=time, offset=1) + shift(dt, over=time, offset=1, edge=0)
      + (running - 1) * uptime_big_m

  # minimum run length, read one step ahead
  uptime_min_run:
    foreach: [status_entity, time, period]
    where: "has_uptime AND uptime_min AND NOT is_last"
    expression: uptime >= uptime_min * (running - shift(running, over=time, offset=-1))

  # --- P in [rel_lb, rel_ub] * S with S a decision variable — so these leave
  # `bounds:` and become rows (lpspec #31).
  sizing_rate_min:
    foreach: [flow, time, period]
    where: "(has_sizing OR has_invest) AND NOT is_gated AND is_bounded"
    expression: rate >= relative_rate_min * size

  sizing_rate_max:
    foreach: [flow, time, period]
    where: "(has_sizing OR has_invest) AND NOT is_gated AND is_bounded"
    expression: rate <= relative_rate_max * size

  sizing_rate_fixed:
    foreach: [flow, time, period]
    where: "(has_sizing OR has_invest) AND NOT is_gated AND is_profile"
    expression: rate == fixed_relative_profile * size

  # --- P <= running*M+, P <= S*rel_ub, P >= (running-1)*M- + S*rel_lb
  status_sizing_rate_bigm:
    foreach: [flow, time, period]
    where: "is_gated AND has_sizing"
    expression: rate <= rate_max_at_size_max * at(running, by=status_of)

  status_sizing_rate_max:
    foreach: [flow, time, period]
    where: "is_gated AND has_sizing"
    expression: rate <= relative_rate_max * size

  status_sizing_rate_min:
    foreach: [flow, time, period]
    where: "is_gated AND has_sizing"
    expression: >-
      rate - rate_min_at_size_max * at(running, by=status_of) - relative_rate_min * size
      >= 0 - rate_min_at_size_max

  # an unbuilt unit cannot be running
  status_sizing_gate_size:
    foreach: [flow, time, period]
    where: "is_gated AND has_sizing AND size_min > 0"
    expression: size >= size_min * at(running, by=status_of)

  status_sizing_gate_built:
    foreach: [flow, time, period]
    where: "is_gated AND has_sizing AND NOT mandatory AND NOT (size_min > 0)"
    expression: at(running, by=status_of) <= size_built

  sizing_mandatory_built:
    foreach: [flow, period]
    where: "has_sizing AND mandatory"
    expression: size_built == 1

  sizing_min:
    foreach: [flow, period]
    where: "has_sizing AND mandatory"
    expression: size >= size_min

  sizing_optional_min:
    foreach: [flow, period]
    where: "has_sizing AND NOT mandatory"
    expression: size >= size_min * size_built

  sizing_optional_max:
    foreach: [flow, period]
    where: "has_sizing AND NOT mandatory"
    expression: size <= size_max * size_built

  # --- P_t - P_{t-1} <= r+ * S * dt, relaxed at a startup for status flows.
  # Periods are independent, hence the is_first mask.
  ramp_up:
    foreach: [flow, time, period]
    where: "has_ramp_up AND NOT is_first AND NOT has_sizing AND NOT is_gated"
    expression: rate - shift(rate, over=time, offset=1) <= ramp_up_limit

  ramp_up_status:
    foreach: [flow, time, period]
    where: "has_ramp_up AND NOT is_first AND NOT has_sizing AND is_gated"
    expression: rate - shift(rate, over=time, offset=1) - size_bound * at(startup, by=status_of) <= ramp_up_limit

  ramp_up_sized:
    foreach: [flow, time, period]
    where: "has_ramp_up AND NOT is_first AND has_sizing AND NOT is_gated"
    expression: rate - shift(rate, over=time, offset=1) - ramp_up_coeff * size <= 0

  ramp_up_sized_status:
    foreach: [flow, time, period]
    where: "has_ramp_up AND NOT is_first AND has_sizing AND is_gated"
    expression: >-
      rate - shift(rate, over=time, offset=1) - ramp_up_coeff * size
      - size_bound * at(startup, by=status_of) <= 0

  ramp_down:
    foreach: [flow, time, period]
    where: "has_ramp_down AND NOT is_first AND NOT has_sizing AND NOT is_gated"
    expression: shift(rate, over=time, offset=1) - rate <= ramp_down_limit

  ramp_down_status:
    foreach: [flow, time, period]
    where: "has_ramp_down AND NOT is_first AND NOT has_sizing AND is_gated"
    expression: shift(rate, over=time, offset=1) - rate - size_bound * at(shutdown, by=status_of) <= ramp_down_limit

  ramp_down_sized:
    foreach: [flow, time, period]
    where: "has_ramp_down AND NOT is_first AND has_sizing AND NOT is_gated"
    expression: shift(rate, over=time, offset=1) - rate - ramp_down_coeff * size <= 0

  ramp_down_sized_status:
    foreach: [flow, time, period]
    where: "has_ramp_down AND NOT is_first AND has_sizing AND is_gated"
    expression: >-
      shift(rate, over=time, offset=1) - rate - ramp_down_coeff * size
      - size_bound * at(shutdown, by=status_of) <= 0

  # --- capacity as a decision variable: the level envelope becomes rows.
  cap_level_max:
    foreach: [storage, time, period]
    where: "has_capacity_sizing"
    expression: level <= capacity

  cap_level_rel_min:
    foreach: [storage, time, period]
    where: "has_capacity_sizing"
    expression: level >= relative_level_min * capacity

  cap_level_rel_max:
    foreach: [storage, time, period]
    where: "has_capacity_sizing"
    expression: level <= relative_level_max * capacity

  cap_mandatory_built:
    foreach: [storage, period]
    where: "has_capacity_sizing AND capacity_mandatory"
    expression: capacity_built == 1

  cap_min:
    foreach: [storage, period]
    where: "has_capacity_sizing AND capacity_mandatory"
    expression: capacity >= capacity_min

  cap_optional_min:
    foreach: [storage, period]
    where: "has_capacity_sizing AND NOT capacity_mandatory"
    expression: capacity >= capacity_min * capacity_built

  cap_optional_max:
    foreach: [storage, period]
    where: "has_capacity_sizing AND NOT capacity_mandatory"
    expression: capacity <= capacity_max * capacity_built

  # --- downtime mirrors uptime with the state inverted: (1 - running).
  # (1-running[t]) - (1-running[t+1]) reduces to shift(running, by=-1) - running.
  downtime_gate:
    foreach: [status_entity, time, period]
    where: "has_downtime"
    expression: downtime + downtime_big_m * running <= downtime_big_m

  downtime_accum_max:
    foreach: [status_entity, time, period]
    where: "has_downtime AND NOT is_first"
    expression: downtime <= shift(downtime, over=time, offset=1) + shift(dt, over=time, offset=1, edge=0)

  downtime_accum_min:
    foreach: [status_entity, time, period]
    where: "has_downtime AND NOT is_first"
    expression: >-
      downtime >= shift(downtime, over=time, offset=1) + shift(dt, over=time, offset=1, edge=0)
      - downtime_big_m * running

  downtime_min_run:
    foreach: [status_entity, time, period]
    where: "has_downtime AND downtime_min AND NOT is_last"
    expression: downtime >= downtime_min * (shift(running, over=time, offset=-1) - running)

  # --- carry-over from before the horizon:
  # duration[0] = state[0] * (previous + dt[0]), and a prior run shorter than
  # the minimum forces continuation.
  uptime_carryover:
    foreach: [status_entity, time, period]
    where: "is_first AND previous_uptime"
    expression: uptime == running * (previous_uptime + dt)

  downtime_carryover:
    foreach: [status_entity, time, period]
    where: "is_first AND previous_downtime"
    expression: downtime + running * (previous_downtime + dt) == previous_downtime + dt

  status_forced_on:
    foreach: [status_entity, time, period]
    where: "is_first AND forced_on_at_start"
    expression: running >= 1

  status_forced_off:
    foreach: [status_entity, time, period]
    where: "is_first AND forced_off_at_start"
    expression: running <= 0

  storage_final_min:
    foreach: [storage, time, period]
    where: "is_last AND final_level_min"
    expression: level >= final_level_min

  storage_final_max:
    foreach: [storage, time, period]
    where: "is_last AND final_level_max"
    expression: level <= final_level_max

  # --- P^c <= M^c b,  P^d <= M^d (1 - b)
  storage_no_simul_charge:
    foreach: [storage, time, period]
    where: "prevent_simultaneous"
    expression: sum(rate, by=charge_storage) - sum(size_bound, by=charge_storage) * charging <= 0

  storage_no_simul_discharge:
    foreach: [storage, time, period]
    where: "prevent_simultaneous"
    expression: >-
      sum(rate, by=discharge_storage) + sum(size_bound, by=discharge_storage) * charging
      <= sum(size_bound, by=discharge_storage)

  # --- build at most once (exactly once when mandatory); never when capacity
  # already exists from before the horizon.
  invest_build_mandatory:
    foreach: [flow]
    where: "has_invest AND mandatory AND NOT has_prior_capacity"
    expression: sum(invest_build, over=build_period) == 1

  invest_build_optional:
    foreach: [flow]
    where: "has_invest AND NOT mandatory AND NOT has_prior_capacity"
    expression: sum(invest_build, over=build_period) <= 1

  invest_build_prior:
    foreach: [flow]
    where: "has_invest AND has_prior_capacity"
    expression: sum(invest_build, over=build_period) == 0

  invest_active_logic:
    foreach: [flow, period]
    where: "has_invest"
    expression: >-
      invest_active - sum(invest_build * lifetime_window, over=build_period)
      == prior_capacity_active

  invest_size_prior:
    foreach: [flow]
    where: "has_invest AND has_prior_capacity"
    expression: invest_size == prior_capacity

  invest_size_mandatory_min:
    foreach: [flow]
    where: "has_invest AND mandatory AND NOT has_prior_capacity"
    expression: invest_size >= invest_min

  invest_size_optional_min:
    foreach: [flow]
    where: "has_invest AND NOT mandatory AND NOT has_prior_capacity"
    expression: invest_size - invest_min * sum(invest_build, over=build_period) >= 0

  invest_size_optional_max:
    foreach: [flow]
    where: "has_invest AND NOT mandatory AND NOT has_prior_capacity"
    expression: invest_size - invest_max * sum(invest_build, over=build_period) <= 0

  # --- size == invest_size when active, 0 when not (big-M).
  invest_size_link_active:
    foreach: [flow, period]
    where: "has_invest"
    expression: size - invest_max * invest_active <= 0

  invest_size_link_max:
    foreach: [flow, period]
    where: "has_invest"
    expression: size - invest_size <= 0

  invest_size_link_min:
    foreach: [flow, period]
    where: "has_invest"
    expression: size - invest_size - invest_max * invest_active >= 0 - invest_max

  # --- size_at_build == invest_size * build, linearised.
  invest_sab_build:
    foreach: [flow, build_period]
    where: "has_invest"
    expression: invest_size_at_build - invest_max * invest_build <= 0

  invest_sab_max:
    foreach: [flow, build_period]
    where: "has_invest"
    expression: invest_size_at_build - invest_size <= 0

  invest_sab_min:
    foreach: [flow, build_period]
    where: "has_invest"
    expression: >-
      invest_size_at_build - invest_size - invest_max * invest_build
      >= 0 - invest_max

  # --- flow aggregates. Each period is bounded on its own.
  flow_hours_lower:
    foreach: [flow, period]
    where: "flow_hours_min"
    expression: sum(rate * flow_hour_weight, over=time) >= flow_hours_min

  flow_hours_upper:
    foreach: [flow, period]
    where: "flow_hours_max"
    expression: sum(rate * flow_hour_weight, over=time) <= flow_hours_max

  load_factor_lower:
    foreach: [flow, period]
    where: "load_factor_min_bound"
    expression: sum(rate * flow_hour_weight, over=time) >= load_factor_min_bound

  load_factor_upper:
    foreach: [flow, period]
    where: "load_factor_max_bound"
    expression: sum(rate * flow_hour_weight, over=time) <= load_factor_max_bound

  # Sized flows state the same bound with the size on the left, because it is
  # a decision rather than a number.
  load_factor_lower_sized:
    foreach: [flow, period]
    where: "load_factor_min_coeff"
    expression: sum(rate * flow_hour_weight, over=time) - load_factor_min_coeff * size >= 0

  load_factor_upper_sized:
    foreach: [flow, period]
    where: "load_factor_max_coeff"
    expression: sum(rate * flow_hour_weight, over=time) - load_factor_max_coeff * size <= 0

  # --- piecewise: one convexity row per curve, one link row per curve flow.
  pw_convexity:
    foreach: [converter, time, period]
    where: "has_piecewise AND NOT pw_gated"
    expression: sum(lam, over=bp) == 1

  pw_convexity_gated:
    foreach: [converter, time, period]
    where: "has_piecewise AND pw_gated"
    expression: sum(lam, over=bp) == at(running, by=pw_status_of)

  # A link is a row keyed on the flow, so a curve ties as many flows as it has.
  pw_link_equal:
    foreach: [flow, time, period]
    where: "is_piecewise AND pw_equal"
    expression: rate == sum(at(lam, by=converter_of) * pw_bp_value, over=bp)

  pw_link_upper:
    foreach: [flow, time, period]
    where: "is_piecewise AND pw_upper"
    expression: rate <= sum(at(lam, by=converter_of) * pw_bp_value, over=bp)

  pw_link_lower:
    foreach: [flow, time, period]
    where: "is_piecewise AND pw_lower"
    expression: rate >= sum(at(lam, by=converter_of) * pw_bp_value, over=bp)

  # Adjacency: weight may only be carried by the segment in use, or the one
  # ending at this breakpoint. Together with the pick row below this is SOS2.
  pw_adjacency:
    foreach: [converter, bp, time, period]
    where: "pw_bp_present"
    expression: lam <= seg + shift(seg, over=bp, offset=1, edge=0)

  pw_segment_pick:
    foreach: [converter, time, period]
    where: "has_piecewise AND NOT pw_gated"
    expression: sum(seg, over=bp) == 1

  pw_segment_pick_gated:
    foreach: [converter, time, period]
    where: "has_piecewise AND pw_gated"
    expression: sum(seg, over=bp) == at(running, by=pw_status_of)

  # Availability scales the envelope rather than the curve, so it bounds the
  # reference link instead of moving the breakpoints.
  pw_availability:
    foreach: [converter, time, period]
    where: "has_piecewise AND NOT pw_gated"
    expression: sum(rate * pw_ref, by=converter_of) <= pw_avail_bound

  pw_availability_gated:
    foreach: [converter, time, period]
    where: "has_piecewise AND pw_gated"
    expression: >-
      sum(rate * pw_ref, by=converter_of) - pw_avail_bound * at(running, by=pw_status_of)
      <= 0

  effect_accounting:
    foreach: [effect, period]
    expression: effect_total == effect_temporal + effect_lump

  effect_periodic_min:
    foreach: [effect, period]
    where: "periodic_min"
    expression: effect_total >= periodic_min

  effect_periodic_max:
    foreach: [effect, period]
    where: "periodic_max"
    expression: effect_total <= periodic_max

  effect_total_lower:
    foreach: [effect]
    where: "total_min"
    expression: sum(effect_total * period_weight, over=period) >= total_min

  effect_total_upper:
    foreach: [effect]
    where: "total_max"
    expression: sum(effect_total * period_weight, over=period) <= total_max

objective:
  sense: minimize
  expression: sum(sum(effect_total * objective_weight, over=period), over=effect)
