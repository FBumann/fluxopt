# fluxopt core math as a linopy-yaml program.
#
# Scope: single-period, fixed-size flows — flow rates, carrier balance,
# converter equations, storage recurrence, temporal effects.
# Out of scope for round 1: sizing, investment, status, piecewise, ramps.
#
# Semantics mirror fluxopt.model.FlowSystemModel:
#   - end-of-period storage convention, level[t] = level[t-1]*retention + net
#   - cyclic storage wraps (roll), acyclic uses a data-side prior (shift)
#   - effect coefficients arrive Leontief-folded and dt/weight-scaled
#
# Every relation is a 1-D mapping parameter joined by group_sum. Sparsity is
# carried by row absence: a parameter keeps its declared rank, its table only
# holds live entries.

dimensions:
  time: {dtype: int}
  period: {dtype: int}
  # The period a unit was built in. Same labels as `period`; a separate axis
  # so a build decision can be summed into the periods it keeps alive.
  build_period: {dtype: int}
  carrier: {dtype: str}
  converter: {dtype: str}
  eq_idx: {dtype: int}
  storage: {dtype: str}
  effect: {dtype: str}
  # Every relation a flow participates in is a coordinate on the flow label,
  # supplied as one index table. group_sum reads these, not parameters.
  flow:
    dtype: str
    coords:
      carrier: carrier
      converter: converter
      charge_storage: storage
      discharge_storage: storage

parameters:
  # Boundary mask as data, not a `time > 0` comparison: with ragged
  # multi-period time the first step of *each* period is a boundary.
  is_first: {dims: [time], dtype: bool}

  # --- flows: absolute bounds (rel_bound * size, folded data-side because
  # bounds: accepts only a bare parameter name) ---------------------------
  rate_min: {dims: [flow, time, period]}
  rate_max: {dims: [flow, time, period]}

  # --- carrier balance ---------------------------------------------------
  carrier_sign: {dims: [flow]}

  # --- converters --------------------------------------------------------
  # A flow belongs to exactly one component, so the (converter, flow) matrix
  # collapses to a mapping plus a coefficient keyed on flow.
  conversion_factor: {dims: [flow, eq_idx, time]}
  conversion_active: {dims: [converter, eq_idx], dtype: bool}

  # --- storage -----------------------------------------------------------
  charge_gain: {dims: [flow, time]}      # eta_c * dt
  discharge_draw: {dims: [flow, time]}   # dt / eta_d
  retention: {dims: [storage, time]}       # (1 - loss) ** dt
  level_min: {dims: [storage, time]}
  level_max: {dims: [storage, time]}
  is_cyclic: {dims: [storage], dtype: bool}
  prior_level: {dims: [storage]}

  # --- status (on/off) ----------------------------------------------------
  has_status: {dims: [flow], dtype: bool}
  is_bounded: {dims: [flow], dtype: bool}
  is_profile: {dims: [flow], dtype: bool}
  rate_min_when_on: {dims: [flow, time, period]}     # size * rel_lb, gated by `running`
  rate_max_when_on: {dims: [flow, time, period]}     # size * rel_ub, gated by `running`
  rate_fixed_when_on: {dims: [flow, time, period]}    # size * profile, gated by `running`
  has_uptime: {dims: [flow], dtype: bool}
  uptime_min: {dims: [flow]}
  uptime_upper: {dims: [flow, time, period]}      # uptime_max where given, else mega
  uptime_big_m: {dims: [flow]}              # big-M: horizon + any prior uptime
  downtime_big_m: {dims: [flow]}            # big-M: horizon + any prior downtime
  dt: {dims: [time]}                       # timestep duration [h]
  is_last: {dims: [time], dtype: bool}
  has_downtime: {dims: [flow], dtype: bool}
  downtime_min: {dims: [flow]}
  downtime_upper: {dims: [flow, time, period]}
  initial_status: {dims: [flow]}
  previous_uptime: {dims: [flow]}
  previous_downtime: {dims: [flow]}
  forced_on_at_start: {dims: [flow], dtype: bool}    # prior run shorter than uptime_min
  forced_off_at_start: {dims: [flow], dtype: bool}
  effects_per_running_hour: {dims: [flow, effect, time, period]}       # running effects * dt
  effects_per_startup: {dims: [flow, effect, time, period]}  # startup effects

  # --- sizing (capacity optimisation) -------------------------------------
  has_sizing: {dims: [flow], dtype: bool}
  size_optional: {dims: [flow], dtype: bool}   # sizing without `mandatory`
  size_min: {dims: [flow]}
  size_max: {dims: [flow]}
  size_upper: {dims: [flow, period]}   # upper bound of `size`: sizing max or invest max
  relative_rate_min: {dims: [flow, time, period]}
  relative_rate_max: {dims: [flow, time, period]}
  fixed_relative_profile: {dims: [flow, time, period]}
  # Lump-domain effect coefficients, Leontief-folded like the temporal ones.
  effects_per_size: {dims: [flow, effect, period]}
  effects_fixed: {dims: [flow, effect, period]}
  effects_fixed_mandatory: {dims: [effect, period]}

  # --- status x sizing: big-M decoupling of the binary from the size -------
  rate_max_at_size_max: {dims: [flow, time, period]}   # size_max * rel_ub
  rate_min_at_size_max: {dims: [flow, time, period]}   # size_max * rel_lb

  # --- investment (build timing over periods) ------------------------------
  has_invest: {dims: [flow], dtype: bool}
  invest_mandatory: {dims: [flow], dtype: bool}
  invest_min: {dims: [flow]}
  invest_max: {dims: [flow]}
  prior_capacity: {dims: [flow]}
  has_prior_capacity: {dims: [flow], dtype: bool}
  # 1 where a build in `build_period` is still within lifetime in `period`
  lifetime_window: {dims: [flow, period, build_period]}
  # 1 where pre-existing capacity is still active
  prior_capacity_active: {dims: [flow, period]}
  # lump coefficients, Leontief-folded like the rest
  # At-build effects land in the period the unit was built in, not in every
  # period, so these carry both axes and are non-zero only on the diagonal.
  effects_per_size_at_build: {dims: [flow, effect, period, build_period]}
  effects_fixed_at_build: {dims: [flow, effect, period, build_period]}
  effects_per_size_recurring: {dims: [flow, effect, period]}
  effects_fixed_recurring: {dims: [flow, effect, period]}

  # --- ramps --------------------------------------------------------------
  has_ramp_up: {dims: [flow], dtype: bool}
  has_ramp_down: {dims: [flow], dtype: bool}
  ramp_up_limit: {dims: [flow, time, period]}    # r+ * dt * size   (fixed size)
  ramp_down_limit: {dims: [flow, time, period]}
  ramp_up_coeff: {dims: [flow, time, period]}    # r+ * dt          (sized: size is a variable)
  ramp_down_coeff: {dims: [flow, time, period]}
  ramp_bigM: {dims: [flow]}              # static size bound, relaxes across transitions

  # --- storage: end-of-horizon bounds and charge/discharge exclusion --------
  final_level_min: {dims: [storage]}
  final_level_max: {dims: [storage]}
  prevent_simultaneous: {dims: [storage], dtype: bool}
  charge_size_bound: {dims: [storage]}      # static size bound of the charge flow
  discharge_size_bound: {dims: [storage]}

  # --- storage sizing -----------------------------------------------------
  has_capacity_sizing: {dims: [storage], dtype: bool}
  capacity_optional: {dims: [storage], dtype: bool}
  capacity_min: {dims: [storage]}
  capacity_max: {dims: [storage]}
  relative_level_min: {dims: [storage, time]}
  relative_level_max: {dims: [storage, time]}
  effects_per_capacity: {dims: [storage, effect, period]}
  effects_fixed_capacity: {dims: [storage, effect, period]}

  # --- effects -----------------------------------------------------------
  # coeff * dt * time_weight, Leontief inverse already folded in (numpy).
  # Declared (flow, effect, time); only live pairs are supplied.
  effects_per_flow_hour: {dims: [flow, effect, time, period]}
  # objective weight x period weight, folded data-side
  objective_weight: {dims: [effect, period]}
  # effect limits: per period, and across periods (weighted)
  periodic_min: {dims: [effect, period]}
  periodic_max: {dims: [effect, period]}
  total_min: {dims: [effect]}
  total_max: {dims: [effect]}
  period_weight: {dims: [effect, period]}

variables:
  rate:
    foreach: [flow, time, period]
    bounds: {lower: rate_min, upper: rate_max}

  level:
    foreach: [storage, time, period]
    bounds: {lower: level_min, upper: level_max}

  running:
    foreach: [flow, time, period]
    where: "has_status"
    binary: true

  startup:
    foreach: [flow, time, period]
    where: "has_status"
    binary: true

  shutdown:
    foreach: [flow, time, period]
    where: "has_status"
    binary: true

  uptime:
    foreach: [flow, time, period]
    where: "has_uptime"
    bounds: {lower: 0, upper: uptime_upper}

  downtime:
    foreach: [flow, time, period]
    where: "has_downtime"
    bounds: {lower: 0, upper: downtime_upper}

  # Investment flows share this variable — `size` is the capacity available in
  # a period, whether it came from Sizing or from a build decision.
  size:
    foreach: [flow, period]
    where: "has_sizing OR has_invest"
    bounds: {lower: 0, upper: size_upper}

  invest_size:
    foreach: [flow]
    where: "has_invest"
    bounds: {lower: 0, upper: invest_max}

  invest_build:
    foreach: [flow, build_period]
    where: "has_invest"
    binary: true

  invest_active:
    foreach: [flow, period]
    where: "has_invest"
    binary: true

  invest_size_at_build:
    foreach: [flow, build_period]
    where: "has_invest"
    bounds: {lower: 0, upper: invest_max}

  size_built:
    foreach: [flow, period]
    where: "size_optional"
    binary: true

  capacity:
    foreach: [storage, period]
    where: "has_capacity_sizing"
    bounds: {lower: 0, upper: capacity_max}

  capacity_built:
    foreach: [storage, period]
    where: "capacity_optional"
    binary: true

  charging:
    foreach: [storage, time, period]
    where: "prevent_simultaneous"
    binary: true

  effect_total:
    foreach: [effect, period]
    bounds: {lower: -.inf, upper: .inf}

macros:
  # Every effect contribution has one of three shapes. Naming them turns the
  # accounting equation into a ledger you can read line by line.
  per_step:
    args: [driver, coeff]
    template: sum(sum(driver * coeff, over=time), over=flow)
  per_entity:
    args: [driver, coeff]
    kwargs: [over]
    template: sum(driver * coeff, over=over)
  at_build:
    args: [driver, coeff]
    template: sum(sum(driver * coeff, over=build_period), over=flow)

expressions:
  net_charge: >-
    group_sum(rate * charge_gain, over=flow, by=charge_storage)
    - group_sum(rate * discharge_draw, over=flow, by=discharge_storage)

constraints:
  carrier_balance:
    foreach: [carrier, time, period]
    equations:
      - expression: group_sum(rate * carrier_sign, over=flow, by=carrier) == 0

  conversion:
    foreach: [converter, eq_idx, time, period]
    equations:
      - expression: group_sum(rate * conversion_factor, over=flow, by=converter) == 0
        where: "conversion_active"

  storage_balance:
    foreach: [storage, time, period]
    equations:
      # cyclic: roll wraps, so t=0 reads level[last] — no prior variable needed
      - expression: level == roll(level, time=1) * retention + net_charge
        where: "is_cyclic"
      - expression: level == shift(level, time=1) * retention + net_charge
        where: "NOT is_cyclic AND NOT is_first"
      - expression: level == prior_level * retention + net_charge
        where: "NOT is_cyclic AND is_first"

  # Semi-continuous rate: {0} u [size*rel_lb, size*rel_ub], gated by `running`.
  status_rate:
    foreach: [flow, time, period]
    where: "has_status AND NOT has_sizing"
    equations:
      - expression: rate >= rate_min_when_on * running
        where: "is_bounded"
      - expression: rate <= rate_max_when_on * running
        where: "is_bounded"
      - expression: rate == rate_fixed_when_on * running
        where: "is_profile"

  status_transition:
    foreach: [flow, time, period]
    where: "has_status"
    equations:
      - expression: startup - shutdown == running - shift(running, time=1)
        where: "NOT is_first"
      - expression: startup - shutdown == running - initial_status
        where: "initial_status AND is_first"
      - expression: startup + shutdown <= 1

  # Big-M duration tracking: uptime[t] accumulates dt while `running` holds.
  uptime_track:
    foreach: [flow, time, period]
    where: "has_uptime"
    equations:
      - expression: uptime <= uptime_big_m * running
      - expression: uptime <= shift(uptime, time=1) + shift(dt, time=1)
        where: "NOT is_first"
      - expression: uptime >= shift(uptime, time=1) + shift(dt, time=1) + (running - 1) * uptime_big_m
        where: "NOT is_first"
      # minimum run length, read one step ahead
      - expression: uptime >= uptime_min * (running - shift(running, time=-1))
        where: "uptime_min AND NOT is_last"

  # P in [rel_lb, rel_ub] * S with S a decision variable — so these leave
  # `bounds:` and become rows (linopy-yaml #31).
  sizing_rate:
    foreach: [flow, time, period]
    where: "(has_sizing OR has_invest) AND NOT has_status"
    equations:
      - expression: rate >= relative_rate_min * size
        where: "is_bounded"
      - expression: rate <= relative_rate_max * size
        where: "is_bounded"
      - expression: rate == fixed_relative_profile * size
        where: "is_profile"

  # P <= running*M+, P <= S*rel_ub, P >= (running-1)*M- + S*rel_lb
  status_sizing_rate:
    foreach: [flow, time, period]
    where: "has_status AND has_sizing"
    equations:
      - expression: rate <= rate_max_at_size_max * running
      - expression: rate <= relative_rate_max * size
      - expression: rate - rate_min_at_size_max * running - relative_rate_min * size >= 0 - rate_min_at_size_max

  # an unbuilt unit cannot be running
  status_sizing_gate:
    foreach: [flow, time, period]
    where: "has_status AND has_sizing"
    equations:
      - expression: size >= size_min * running
        where: "size_min > 0"
      - expression: running <= size_built
        where: "size_optional AND NOT (size_min > 0)"

  sizing_bounds:
    foreach: [flow, period]
    where: "has_sizing"
    equations:
      - expression: size >= size_min
        where: "NOT size_optional"
      - expression: size >= size_min * size_built
        where: "size_optional"
      - expression: size <= size_max * size_built
        where: "size_optional"

  # P_t - P_{t-1} <= r+ * S * dt, relaxed at a startup for status flows.
  # Periods are independent, hence the is_first mask.
  ramp_up_con:
    foreach: [flow, time, period]
    where: "has_ramp_up AND NOT is_first"
    equations:
      - expression: rate - shift(rate, time=1) <= ramp_up_limit
        where: "NOT has_sizing AND NOT has_status"
      - expression: rate - shift(rate, time=1) - ramp_bigM * startup <= ramp_up_limit
        where: "NOT has_sizing AND has_status"
      - expression: rate - shift(rate, time=1) - ramp_up_coeff * size <= 0
        where: "has_sizing AND NOT has_status"
      - expression: rate - shift(rate, time=1) - ramp_up_coeff * size - ramp_bigM * startup <= 0
        where: "has_sizing AND has_status"

  ramp_down_con:
    foreach: [flow, time, period]
    where: "has_ramp_down AND NOT is_first"
    equations:
      - expression: shift(rate, time=1) - rate <= ramp_down_limit
        where: "NOT has_sizing AND NOT has_status"
      - expression: shift(rate, time=1) - rate - ramp_bigM * shutdown <= ramp_down_limit
        where: "NOT has_sizing AND has_status"
      - expression: shift(rate, time=1) - rate - ramp_down_coeff * size <= 0
        where: "has_sizing AND NOT has_status"
      - expression: shift(rate, time=1) - rate - ramp_down_coeff * size - ramp_bigM * shutdown <= 0
        where: "has_sizing AND has_status"

  # Capacity as a decision variable: the level envelope becomes rows.
  cap_level:
    foreach: [storage, time, period]
    where: "has_capacity_sizing"
    equations:
      - expression: level <= capacity
      - expression: level >= relative_level_min * capacity
      - expression: level <= relative_level_max * capacity

  cap_bounds:
    foreach: [storage, period]
    where: "has_capacity_sizing"
    equations:
      - expression: capacity >= capacity_min
        where: "NOT capacity_optional"
      - expression: capacity >= capacity_min * capacity_built
        where: "capacity_optional"
      - expression: capacity <= capacity_max * capacity_built
        where: "capacity_optional"

  # Downtime mirrors uptime with the state inverted: (1 - running).
  # (1-running[t]) - (1-running[t+1]) reduces to shift(running, time=-1) - running.
  downtime_track:
    foreach: [flow, time, period]
    where: "has_downtime"
    equations:
      - expression: downtime + downtime_big_m * running <= downtime_big_m
      - expression: downtime <= shift(downtime, time=1) + shift(dt, time=1)
        where: "NOT is_first"
      - expression: downtime >= shift(downtime, time=1) + shift(dt, time=1) - downtime_big_m * running
        where: "NOT is_first"
      - expression: downtime >= downtime_min * (shift(running, time=-1) - running)
        where: "downtime_min AND NOT is_last"

  # Carry-over from before the horizon: duration[0] = state[0] * (previous + dt[0]),
  # and a prior run shorter than the minimum forces continuation.
  status_previous:
    foreach: [flow, time, period]
    where: "is_first"
    equations:
      - expression: uptime == running * (previous_uptime + dt)
        where: "previous_uptime"
      - expression: downtime + running * (previous_downtime + dt) == previous_downtime + dt
        where: "previous_downtime"
      - expression: running >= 1
        where: "forced_on_at_start"
      - expression: running <= 0
        where: "forced_off_at_start"

  storage_final:
    foreach: [storage, time, period]
    where: "is_last"
    equations:
      - expression: level >= final_level_min
        where: "final_level_min"
      - expression: level <= final_level_max
        where: "final_level_max"

  # P^c <= M^c b,  P^d <= M^d (1 - b)
  storage_no_simul:
    foreach: [storage, time, period]
    where: "prevent_simultaneous"
    equations:
      - expression: group_sum(rate, over=flow, by=charge_storage) - charge_size_bound * charging <= 0
      - expression: group_sum(rate, over=flow, by=discharge_storage) + discharge_size_bound * charging <= discharge_size_bound

  # Build at most once (exactly once when mandatory); never when capacity
  # already exists from before the horizon.
  invest_build_once:
    foreach: [flow]
    where: "has_invest"
    equations:
      - expression: sum(invest_build, over=build_period) == 1
        where: "invest_mandatory AND NOT has_prior_capacity"
      - expression: sum(invest_build, over=build_period) <= 1
        where: "NOT invest_mandatory AND NOT has_prior_capacity"
      - expression: sum(invest_build, over=build_period) == 0
        where: "has_prior_capacity"

  invest_active_logic:
    foreach: [flow, period]
    where: "has_invest"
    equations:
      - expression: invest_active - sum(invest_build * lifetime_window, over=build_period) == prior_capacity_active

  invest_size_bounds:
    foreach: [flow]
    where: "has_invest"
    equations:
      - expression: invest_size == prior_capacity
        where: "has_prior_capacity"
      - expression: invest_size >= invest_min
        where: "invest_mandatory AND NOT has_prior_capacity"
      - expression: invest_size - invest_min * sum(invest_build, over=build_period) >= 0
        where: "NOT invest_mandatory AND NOT has_prior_capacity"
      - expression: invest_size - invest_max * sum(invest_build, over=build_period) <= 0
        where: "NOT invest_mandatory AND NOT has_prior_capacity"

  # size == invest_size when active, 0 when not (big-M).
  invest_size_link:
    foreach: [flow, period]
    where: "has_invest"
    equations:
      - expression: size - invest_max * invest_active <= 0
      - expression: size - invest_size <= 0
      - expression: size - invest_size - invest_max * invest_active >= 0 - invest_max

  # size_at_build == invest_size * build, linearised.
  invest_sab_link:
    foreach: [flow, build_period]
    where: "has_invest"
    equations:
      - expression: invest_size_at_build - invest_max * invest_build <= 0
      - expression: invest_size_at_build - invest_size <= 0
      - expression: invest_size_at_build - invest_size - invest_max * invest_build >= 0 - invest_max

  effect_accounting:
    foreach: [effect, period]
    equations:
      - expression: >-
          effect_total == per_step(rate, effects_per_flow_hour)
          + per_step(running, effects_per_running_hour)
          + per_step(startup, effects_per_startup)
          + per_entity(size, effects_per_size, over=flow)
          + per_entity(size_built, effects_fixed, over=flow)
          + per_entity(capacity, effects_per_capacity, over=storage)
          + per_entity(capacity_built, effects_fixed_capacity, over=storage)
          + at_build(invest_size_at_build, effects_per_size_at_build)
          + at_build(invest_build, effects_fixed_at_build)
          + per_entity(size, effects_per_size_recurring, over=flow)
          + per_entity(invest_active, effects_fixed_recurring, over=flow)
          + effects_fixed_mandatory

  effect_periodic_bounds:
    foreach: [effect, period]
    equations:
      - expression: effect_total >= periodic_min
        where: "periodic_min"
      - expression: effect_total <= periodic_max
        where: "periodic_max"

  effect_total_bounds:
    foreach: [effect]
    equations:
      - expression: sum(effect_total * period_weight, over=period) >= total_min
        where: "total_min"
      - expression: sum(effect_total * period_weight, over=period) <= total_max
        where: "total_max"

objectives:
  weighted_effects:
    sense: minimize
    equations:
      - expression: sum(sum(effect_total * objective_weight, over=period), over=effect)
